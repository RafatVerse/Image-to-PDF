name: Auto Sync to Fork

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Fork
        run: |
          git push --force https://x-access-token:${{ secrets.IMAGE_TO_PDF_MAKER }}@github.com/tanzox/Image-to-PDF.git main
